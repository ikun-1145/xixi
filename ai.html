<!-- 登录状态守卫：进入 ai.html 时若未登录则跳转 login.html -->
<script>
(function () {
  window.__SUNLAND_AI_AUTH_OK__ = false;

  function redirectToLogin() {
    location.replace("login.html?return=ai.html");
  }

  try {
    // 此处只负责没有 Token 时尽早跳转。Token 是否有效、属于谁，只能由
    // app.js 的 IdentityAuthority 通过服务端 /refresh 验证后决定。
    // localStorage.user 永远不是认证依据。
    var token = localStorage.getItem("token");
    if (!token) {
      redirectToLogin();
      return;
    }
    window.__SUNLAND_AI_AUTH_OK__ = true;
  } catch (e) {
    redirectToLogin();
  }
})();
</script>
