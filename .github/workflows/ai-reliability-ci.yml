name: AI Web Reliability CI

on:
  pull_request:
    paths:
      - "ai/**"
      - "p/js/site-i18n.js"
      - ".agent-sync/**"
      - ".agents/skills/**"
      - ".codex/agents/**"
      - "scripts/roster.py"
      - "scripts/build*phone*.mjs"
      - "workers/phone-auth/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ai-reliability-ci.yml"

# Verification only. No deployment or production API calls.
permissions:
  contents: read

jobs:
  web-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout proposed changes
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.23.5"
          cache: "npm"

      - name: Set up Python for roster tests
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Check access and read the audited Worker revision
        id: auth-source
        env:
          WORKER_READ_TOKEN: ${{ secrets.SUNLAND_AUTH_WORKER_READ_TOKEN }}
          PR_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [[ "$PR_REPOSITORY" != "$GITHUB_REPOSITORY" || -z "$WORKER_READ_TOKEN" ]]; then
            echo '::error::Worker integration requires a trusted same-repository PR and SUNLAND_AUTH_WORKER_READ_TOKEN with private source Contents: Read.'
            exit 1
          fi
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const { sourceCommit } = JSON.parse(readFileSync("workers/phone-auth/source-provenance.json", "utf8"));
            if (typeof sourceCommit !== "string" || !/^[a-f0-9]{40}$/.test(sourceCommit)) throw Error("Expected a full Worker commit SHA");
            console.log(`revision=${sourceCommit}`);
          ' >> "$GITHUB_OUTPUT"

      - name: Checkout audited private Worker source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ikun-1145/sunland-ai-dart
          ref: ${{ steps.auth-source.outputs.revision }}
          token: ${{ secrets.SUNLAND_AUTH_WORKER_READ_TOKEN }}
          path: .ci-auth-source
          persist-credentials: false
          fetch-depth: 0
          sparse-checkout: |
            worker
            supabase/migrations

      - name: Verify Worker sources and install locked dependencies
        env:
          WORKER_REVISION: ${{ steps.auth-source.outputs.revision }}
        run: |
          source_dir="$(mktemp -d "$RUNNER_TEMP/sunland-auth.XXXXXXXX")"
          mv "$GITHUB_WORKSPACE/.ci-auth-source" "$source_dir/source"
          worker_root="$source_dir/source/worker"
          test "$(git -C "$worker_root" rev-parse HEAD)" = "$WORKER_REVISION"
          git -C "$worker_root" cat-file -e 'bc5489b6e2962f3e1306aa4de5b4292cecf7ca3d^{commit}'
          node --input-type=module -e 'import { verifyPhoneAuthWorkerSource } from "./scripts/build-phone-auth-worker.mjs"; await verifyPhoneAuthWorkerSource(process.argv[1]);' "$worker_root"
          npm ci --prefix "$worker_root" --ignore-scripts --no-audit --no-fund
          echo "SUNLAND_AUTH_WORKER_ROOT=$worker_root" >> "$GITHUB_ENV"

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Check changed JavaScript syntax
        run: |
          node --check ai/app.js
          node --check ai/ai-request-errors.js

      - name: Run complete web test suite
        run: npm test
