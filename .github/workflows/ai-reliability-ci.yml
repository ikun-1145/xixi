name: AI Web Reliability CI

on:
  pull_request:
    paths:
      - "ai/**"
      - "p/js/site-i18n.js"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ai-reliability-ci.yml"

# This workflow is verification-only. No secrets, deployment or production API calls.
permissions:
  contents: read

jobs:
  web-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout proposed changes
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Check changed JavaScript syntax
        run: |
          node --check ai/app.js
          node --check ai/ai-request-errors.js

      - name: Run complete web test suite
        run: npm test
