name: Read-only Worker Health CI

on:
  pull_request:
    paths:
      - "scripts/reliability/**"
      - ".github/workflows/worker-health-ci.yml"

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Syntax
        run: |
          node --check scripts/reliability/worker-health.mjs
          node --check scripts/reliability/worker-health.test.mjs

      - name: Mock-only tests
        run: node --test scripts/reliability/worker-health.test.mjs
