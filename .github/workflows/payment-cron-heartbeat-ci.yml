name: Payment Cron Heartbeat CI

on:
  pull_request:
    paths:
      - "workers/afdianpay/worker.js"
      - "workers/waffopay/worker.js"
      - "workers/waffopay/production.js"
      - "tests/payment-cron-heartbeats.test.mjs"
      - "scripts/reliability/payment-release-preflight.mjs"
      - "scripts/reliability/payment-release-preflight.test.mjs"
      - "docs/reliability/payment-worker-production-baseline-2026-11-03.json"
      - "docs/reliability/payment-release-preflight-2026-11-03.md"
      - ".github/workflows/payment-cron-heartbeat-ci.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout proposed code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies without postinstall hooks
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Syntax checks
        run: |
          node --check workers/afdianpay/worker.js
          node --check workers/waffopay/worker.js
          node --check workers/waffopay/production.js
          node --check tests/payment-cron-heartbeats.test.mjs
          node --check scripts/reliability/payment-release-preflight.mjs
          node --check scripts/reliability/payment-release-preflight.test.mjs

      - name: Release preflight unit tests (fake API, no credentials)
        run: node --test scripts/reliability/payment-release-preflight.test.mjs

      - name: Complete repository tests (mock only)
        run: npm test
