name: Phone auth isolated PostgreSQL acceptance

on:
  pull_request:
    paths:
      - 'workers/phone-auth/**'
      - '.github/workflows/phone-init-isolation.yml'
  workflow_dispatch:

# Synthetic data only. No production credentials, datasets, or remote resources.
permissions:
  contents: read

jobs:
  postgres17:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned PostgreSQL driver
        run: python -m pip install 'psycopg[binary]==3.3.8'
      - name: Exercise phone schema, related triggers, and concurrent initialization
        env:
          PHONE_TEST_POSTGRES_IMAGE: postgres:17-alpine
          PHONE_IDENTITY_MIGRATION: workers/phone-auth/tests/fixtures/phone-identity-reviewed.sql
          PHONE_TRIGGER_FIXTURE: workers/phone-auth/tests/fixtures/related-triggers-reviewed.sql
        run: python workers/phone-auth/tests/initialization-full-postgres.py
      - name: Test protected initialization operations
        run: python -m unittest discover -s workers/phone-auth/tests -p test_operations.py -v
