[observability]
enabled = true
head_sampling_rate = 1

# Webhook 交付级去重 KV（按环境/商店/事件类型/id/eventId 分区）。
# 不是并发锁；未来开通业务必须另由统一权益账本按 provider/PAY_xxx 事务去重。
# ⚠️ 需先 `wrangler kv namespace create WAFFO_EVENTS` 并把返回的 id 填到下方，创建前留空。
# [[kv_namespaces]]
# binding = "WAFFO_EVENTS"
# id = "<待创建>"

# ⚠️ 敏感值不写在这里，Worker 创建后再用命令注入：
#   SUPABASE_ANON_KEY                = Supabase anon key（checkout 转发用户令牌用）
#   WAFFO_PRIVATE_KEY_TEST           = Waffo Test API 私钥（PKCS8 PEM，服务端签名）
#   WAFFO_PRIVATE_KEY_PRODUCTION           = Production API 私钥；仅 production checkout 使用，绝不用于 Test
#   WAFFO_PRODUCTION_SERVICE_ROLE_KEY = 专用于固定 Supabase 权益 RPC 的服务端凭据
#   WAFFO_TEST_INGEST_EMAIL          = 专用 GoTrue ingest bot 邮箱（只登记在 waffo_test.ingest_principals）
#   WAFFO_TEST_INGEST_PASSWORD       = 该 bot 的随机长密码；Worker 每个 isolate 换取 ≤1h access token，refresh token 不保存
#
# 命令（Worker 创建后再执行，本轮不要运行）：
#   wrangler secret put SUPABASE_ANON_KEY
#   wrangler secret put WAFFO_PRIVATE_KEY_TEST
#   wrangler secret put WAFFO_TEST_INGEST_EMAIL
#   wrangler secret put WAFFO_TEST_INGEST_PASSWORD
# Test handler 不使用 Production 凭据；Production RPC 使用独立 WAFFO_PRODUCTION_SERVICE_ROLE_KEY。

# Production-only observation ledger. Never bound to waffo_test or Pro storage.
[[d1_databases]]
binding = "WAFFO_PRODUCTION_LEDGER"
database_name = "waffo-production-observation-ledger"
database_id = "9003f99a-bcef-4ba5-a961-33c399a01ab5"

# Same-zone Worker Routes require a Service Binding; JWT verification remains in ai.
[[services]]
binding = "WAFFO_IDENTITY_SERVICE"
service = "ai"

# Retry only originally verified Production events; fresh provider proof precedes each RPC.
[triggers]
crons = ["*/5 * * * *"]
