name = "waffopay"
main = "worker.js"
compatibility_date = "2026-09-05"
account_id = "5d99df0919786bd4d9de3dd5bdcbfb4d"
# 支付回调不能依赖非生产用途的 workers.dev；由 Cloudflare 托管证书和 DNS。
workers_dev = false

# Test 自定义域名；绑定前须确认现有 DNS/route 归属。
[[routes]]
pattern = "waffopay.sunland.dev"
custom_domain = true

# 非敏感变量（可入库）
[vars]
# Test namespace 目标必须显式配置；Worker 校验 URL/ref/schema，不回落生产 RPC。
WAFFO_TEST_BACKEND = "schema"
WAFFO_TEST_SCHEMA = "waffo_test"
WAFFO_TEST_PROJECT_REF = "klyrasrqgxijwrxuoevj"
WAFFO_TEST_SUPABASE_URL = "https://klyrasrqgxijwrxuoevj.supabase.co"
# webhook ingest bot 的 GoTrue user id（公开标识，非凭据）；须与 waffo_test.ingest_principals 一致。空值 → test 落账 503。
WAFFO_TEST_INGEST_SUB = "52874761-2dfa-4525-80cf-39e86c75562e"

# Waffo 产品（一次性 Pro，¥15）。已确认的 Product Short ID：
WAFFO_PRODUCT_ID = "PROD_4ibh2Jka4tSTmyb35okbRs"
# 已由用户确认；不要影响爱发电 ¥10。
WAFFO_CURRENCY = "CNY"
# 此候选仅用于 Test。API 实际环境由所注入私钥所属环境决定，不能靠此字段覆盖。
WAFFO_ENVIRONMENT = "test"
# 该产品所属 Store Short ID（用户已确认，Dashboard 处于测试模式）。空值使 checkout/webhook 返回 503。
WAFFO_STORE_ID = "STO_4gmpGF9UEj1SO6vpelNcmy"
# Waffo 商户 ID：API Key 请求头 X-Merchant-Id 的公开标识，非私钥凭据，可入库（用户已确认）。
WAFFO_MERCHANT_ID = "MER_6mey7SY5b0KXN1W7JiZYSz"
# 支付成功后收银台"完成"按钮跳转地址（必须 https 绝对地址）。
WAFFO_TEST_SUCCESS_ORIGIN = "https://waffopay.sunland.dev"
# 允许发起 checkout 的前端来源（逗号分隔）。
WAFFO_ALLOWED_ORIGINS = ""

# Production 权益开关：仅作用于独立 Production handler（可信付款证明 + Supabase waffo_prod 来源账本）。
# Test 事件永不读取此开关；关闭时仍记录付款确认但不授予 Pro。
WAFFO_PRODUCTION_ENTITLEMENT_ENABLED = "true"

# Production observation checkout: independent key, product and D1 ledger.
# Never change WAFFO_ENVIRONMENT: the existing /checkout/waffo stays Test-only.
WAFFO_PRODUCTION_ENABLED = "true"
WAFFO_PROD_MERCHANT_ID = "MER_6mey7SY5b0KXN1W7JiZYSz"
WAFFO_PROD_STORE_ID = "STO_4gmpGF9UEj1SO6vpelNcmy"
WAFFO_PROD_PRODUCT_ID = "PROD_5buXbrDEzQX6Nya6p1wMC5"
WAFFO_WEBHOOK_PUBLIC_KEY_PROD = """
