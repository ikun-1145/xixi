<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://api.sunland.dev; img-src 'self' data: blob:;">
  <title>AI App Browser Harness</title>
  <link rel="stylesheet" href="../../ai/styles-1.css">
  <link rel="stylesheet" href="../../ai/styles-2.css">
  <link rel="stylesheet" href="../../ai/model-menu.css">
</head>
<body>
  <div id="harnessStatus">LOADING</div>
  <script type="module">
    const nativeFetch = window.fetch.bind(window);
    const encode = value => btoa(JSON.stringify(value))
      .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/g, '');
    const params = new URLSearchParams(location.search);
    const requestedUserId = params.get('userId') || 'browser-app-user';
    const userId = /^[A-Za-z0-9@._:-]{3,128}$/.test(requestedUserId)
      ? requestedUserId
      : 'browser-app-user';
    const userEmail = `${userId.replace(/[^A-Za-z0-9._-]/g, '-') || 'browser-app'}@example.com`;
    const token = `${encode({ alg: 'test' })}.${encode({ sub: userId, email: userEmail, exp: Math.floor(Date.now() / 1000) + 3600 })}.signature`;
    const keys = [
      'token', 'user', `conversations_${userId}`, `current_conversation_${userId}`,
      `sunland_knowledge_${userId}`, `sunland_knowledge_${userId}::memory`,
    ];
    const preserve = params.get('preserve') === '1';
    const refreshDelayMs = Math.min(Math.max(Number(params.get('delayMs')) || 0, 0), 5000);
    const failFirstAiRequest = params.get('failFirstAiRequest') === '1';
    const replyDelayMs = Math.min(Math.max(Number(params.get('replyDelayMs')) || 0, 0), 5000);
    let aiRequestCount = 0;
    if (params.get('autoConfirm') === '1') window.confirm = () => true;
    if (!preserve) {
      keys.forEach(key => localStorage.removeItem(key));
      localStorage.setItem('token', token);
      localStorage.setItem('user', JSON.stringify({ id: 'stale-other-user', email: 'stale@example.com' }));
    }

    const shellResponse = await nativeFetch('../../ai.html');
    const shellText = await shellResponse.text();
    const shell = new DOMParser().parseFromString(shellText, 'text/html');
    const loadingBootstrap = [...shell.querySelectorAll('script')]
      .find(script => script.textContent.includes('window.__SUNLAND_AI_RESOURCES_READY__'))
      ?.textContent;
    const loadingStyles = [...shell.head.querySelectorAll('style')]
      .find(style => style.textContent.includes('#aiBootScreen'))
      ?.textContent;
    document.documentElement.className = shell.documentElement.className;
    document.body.className = shell.body.className;
    for (const attribute of shell.body.attributes) {
      if (attribute.name !== 'class') document.body.setAttribute(attribute.name, attribute.value);
    }
    if (loadingBootstrap) {
      const bootstrapScript = document.createElement('script');
      bootstrapScript.textContent = loadingBootstrap;
      document.head.appendChild(bootstrapScript);
    }
    if (loadingStyles) {
      const loadingStyle = document.createElement('style');
      loadingStyle.textContent = loadingStyles;
      document.head.appendChild(loadingStyle);
    }
    shell.body.querySelectorAll('script').forEach(script => script.remove());
    document.body.innerHTML = shell.body.innerHTML;

    window.anime = null;
    window.hljs = { highlightElement() {} };
    window.fetch = async (url, options = {}) => {
      const target = String(url);
      if (target === 'https://api.sunland.dev/refresh') {
        if (refreshDelayMs) {
          await new Promise(resolve => setTimeout(resolve, refreshDelayMs));
        }
        try {
          JSON.parse(options.body);
        } catch {
          return new Response(JSON.stringify({ error: 'Bad JSON' }), {
            status: 400,
            headers: { 'Content-Type': 'application/json' },
          });
        }
        return new Response(JSON.stringify({
          token,
          user: { id: userId, email: userEmail },
        }), { status: 200, headers: { 'Content-Type': 'application/json' } });
      }
      if (target.startsWith('https://klyrasrqgxijwrxuoevj.supabase.co/')) {
        return new Response('[]', {
          status: 200,
          headers: { 'Content-Type': 'application/json' },
        });
      }
      if (target === 'https://api.sunland.dev') {
        aiRequestCount += 1;
        if (failFirstAiRequest && aiRequestCount === 1) {
          return new Response(JSON.stringify({ error: 'Mock upstream failure' }), {
            status: 503,
            headers: { 'Content-Type': 'application/json' },
          });
        }
        if (replyDelayMs) {
          await new Promise(resolve => setTimeout(resolve, replyDelayMs));
        }
        const body = JSON.parse(options.body || '{}');
        const encoder = new TextEncoder();
        const stream = new ReadableStream({
          start(controller) {
            if (body.deep) {
              controller.enqueue(encoder.encode(`data: ${JSON.stringify({ choices: [{ delta: { reasoning_content: 'mock reasoning' } }] })}\n`));
            }
            controller.enqueue(encoder.encode(`data: ${JSON.stringify({ choices: [{ delta: { content: `mock ${body.model} reply` } }] })}\n`));
            controller.enqueue(encoder.encode('data: [DONE]\n'));
            controller.close();
          },
        });
        return new Response(stream, { status: 200, headers: { 'Content-Type': 'text/event-stream', 'x-remain': '10' } });
      }
      return nativeFetch(url, options);
    };

    try {
      await import(`../../ai/app.js?browser-harness=${Date.now()}`);
      window.__aiHarness = {
        token,
        cleanup() { keys.forEach(key => localStorage.removeItem(key)); },
      };
      const cleanupButton = document.createElement('button');
      cleanupButton.type = 'button';
      cleanupButton.textContent = '清理验收测试数据';
      cleanupButton.setAttribute('aria-label', '清理验收测试数据');
      cleanupButton.hidden = params.get('showCleanup') !== '1';
      cleanupButton.addEventListener('click', () => {
        window.__aiHarness.cleanup();
        cleanupButton.disabled = true;
        cleanupButton.textContent = '验收测试数据已清理';
      });
      document.body.append(cleanupButton);
      document.body.dataset.harnessReady = 'true';
    } catch (error) {
      window.__aiHarnessError = String(error?.stack || error);
      document.body.dataset.harnessError = window.__aiHarnessError;
    }
  </script>
</body>
</html>
