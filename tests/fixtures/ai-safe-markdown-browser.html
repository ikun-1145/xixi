<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <title>Safe Markdown browser regression</title>
  <script src="https://cdn.jsdelivr.net/npm/marked@18.0.6/lib/marked.umd.js" integrity="sha384-uGn1eBC40GtuBgao0epc/cz9O4Lo8/flg/10SW+69UjLI5nP31iT4UPc65Xz10Le" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.12/dist/purify.min.js" integrity="sha384-piCcpDdJ7qVeK4Tv8Z6Hpcr3ZBIgP16TxQTPVfsLFdZ5uDgwc3Y8Ho7oUnqf12qu" crossorigin="anonymous"></script>
</head>
<body>
  <div id="target"></div>
  <pre id="result">running</pre>
  <script type="module">
    import { renderSafeMarkdown } from "/ai/safe-markdown.js";

    const target = document.getElementById("target");
    const payload = '<img src=x onerror=document.body.dataset.xss=1>' +
      '<script>document.body.dataset.script=1<\/script>' +
      '<svg onload=document.body.dataset.svg=1></svg>安全文本';

    renderSafeMarkdown(target, payload);

    setTimeout(() => {
      document.getElementById("result").textContent = JSON.stringify({
        html: target.innerHTML,
        text: target.textContent,
        xss: document.body.dataset.xss || null,
        script: document.body.dataset.script || null,
        svg: document.body.dataset.svg || null,
      });
    }, 150);
  </script>
</body>
</html>
