<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <title>Safe Markdown browser regression</title>
  <script src="/p/vendor/marked-18.0.6.umd.js"></script>
  <script src="/p/vendor/dompurify-3.4.12.min.js"></script>
</head>
<body>
  <div id="target"></div>
  <pre id="result">running</pre>
  <script type="module">
    import { renderSafeMarkdown } from "/ai/safe-markdown.js";

    const target = document.getElementById("target");
    const payload = '<img src=x onerror=document.body.dataset.xss=1>' +
      '<script>document.body.dataset.script=1<\/script>' +
      '<svg onload=document.body.dataset.svg=1></svg>安全文本';

    renderSafeMarkdown(target, payload);

    setTimeout(() => {
      document.getElementById("result").textContent = JSON.stringify({
        html: target.innerHTML,
        text: target.textContent,
        xss: document.body.dataset.xss || null,
        script: document.body.dataset.script || null,
        svg: document.body.dataset.svg || null,
      });
    }, 150);
  </script>
</body>
</html>
