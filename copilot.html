<script type="module">
/* ============================================================
   护福宝 HuFuBao 前端逻辑
   - 登录态：复用站点已有的 Supabase 登录 token（localStorage.token，
     即 supabase_token；与 ai/app.js 取用户身份的方式完全一致）。
   - 后端：Supabase Edge Function `comment-copilot`，负责密钥、
     额度（每天 20 次 / 北京时间刷新）、上下文（Responses API）与 Vision。
     （函数名沿用历史命名，不影响品牌展示，故不改动。）
   ============================================================ */

const SUPABASE_URL = 'https://klyrasrqgxijwrxuoevj.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtseXJhc3JxZ3hpandyeHVvZXZqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTI4ODUyMzcsImV4cCI6MjA2ODQ2MTIzN30.qjeTrLp_QquSwvF09HrrQd-stPtgu6H51-Zdb4JUeSM';
const FN_URL = SUPABASE_URL + '/functions/v1/comment-copilot';
const REFRESH_URL = 'https://api.sunland.dev/refresh';

/* ---------- 登录 token 处理（镜像 ai/app.js 的逻辑）---------- */
// JWT payload 是 base64url 编码（用 - _ 替代 + /，且无 = 补位），
// 直接 atob() 遇到这些字符会抛异常。之前捕获后 fallback 为“已过期”，
// 触发一次多余的 refresh 请求。这里改为与 ai/app.js / login.html 一致的
// base64url 安全解析。
function decodeJwtPayload(tk){
  try{
    let b64 = tk.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
    while (b64.length % 4) b64 += '=';
    return JSON.parse(atob(b64));
  }catch{ return null; }
}
function isExpired(tk){
  const p = decodeJwtPayload(tk);
  if(!p) return true;
  if(!p.exp) return false;
  return p.exp * 1000 < Date.now() + 5000;
}
async function refreshToken(){
  const old = localStorage.getItem('token');
  if(!old) return null;
  try{
    const res = await fetch(REFRESH_URL, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer ' + old }
    });
    if(!res.ok) return null;
    const data = await res.json().catch(()=>({}));
    if(data && data.token){
      localStorage.setItem('token', data.token);
      if(data.user) localStorage.setItem('user', JSON.stringify(data.user));
      return data.token;
    }
  }catch{}
  return null;
}
async function getFreshToken(){
  let t = localStorage.getItem('token');
  if(!t) return null;
  if(isExpired(t)){
    const n = await refreshToken();
    if(n){
      t = n;
    }else{
      // 刷新失败：说明本地这枚 token 已彻底失效，必须清掉。
      // 否则它会一直留在 localStorage 里，导致后续点击“去登录”跳转到
      // login.html 时，被那边的“已登录守卫”误判为已登录并立即弹回本页，
      // 表现为“点了去登录却又回到当前页面”。
      try{ localStorage.removeItem('token'); }catch{}
      try{ localStorage.removeItem('user'); }catch{}
      return null;
    }
  }
  return t;
}

/* ---------- 调用 Edge Function ---------- */
async function callFn(body, _retried = false){
  const token = await getFreshToken();
  if(!token){ showLogin(); throw new Error('not_logged_in'); }

  const res = await fetch(FN_URL, {
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'apikey': SUPABASE_ANON_KEY,
      'Authorization':'Bearer ' + token
    },
    body: JSON.stringify(body)
  });

  if(res.status === 401 && !_retried){
    const n = await refreshToken();
    if(n) return callFn(body, true);
    // 刷新失败，token 已彻底失效，清掉本地残留，避免 login.html 的
    // “已登录守卫”把它当成有效登录状态而把用户直接弹回本页。
    try{ localStorage.removeItem('token'); }catch{}
    try{ localStorage.removeItem('user'); }catch{}
    showLogin();
    throw new Error('unauthorized');
  }

  let data = null;
  try{ data = await res.json(); }catch{}
  return { ok: res.ok, status: res.status, data: data || {} };
}

/* ---------- DOM ---------- */
const $ = (id) => document.getElementById(id);
const quotaChip = $('quotaChip');
const clearCtxBtn = $('clearCtxBtn');

/* ---------- 状态 ---------- */
let selectedTone = 'rational';
let currentImage = null;   // dataURL
let turnCount = 0;
let busy = false;

/* ---------- 语气滑块（7 档可拖动，弱 → 强）---------- */
const TONES = [
  { key:'reconcile', emoji:'🤝', label:'和解',     desc:'主动示好，化解矛盾',     model:'sonnet' },
  { key:'polite',    emoji:'😊', label:'礼貌',     desc:'客气得体，给彼此留面子', model:'sonnet' },
  { key:'rational',  emoji:'🧐', label:'理性',     desc:'就事论事，冷静讲道理',   model:'sonnet' },
  { key:'humor',     emoji:'😂', label:'幽默',     desc:'轻松调侃，一笑而过',     model:'grok' },
  { key:'sarcasm',   emoji:'😏', label:'阴阳',     desc:'绵里藏针，阴阳怪气',     model:'sonnet' },
  { key:'savage',    emoji:'😈', label:'毒舌',     desc:'犀利反击，一针见血',     model:'grok' },
  { key:'fullfire',  emoji:'💀', label:'火力全开', desc:'火力拉满，绝不退让',     model:'grok' },
];
const MODEL_LABELS = { sonnet: 'Claude', grok: 'Grok' };
const TONE_MAX = TONES.length - 1;
let toneIndex = TONES.findIndex(t => t.key === selectedTone);
if(toneIndex < 0) toneIndex = 2;

const tonePct = (i) => (i / TONE_MAX) * 100;

function buildSlider(){
  TONES.forEach((t, i) => {
    const p = tonePct(i) + '%';

    const tk = document.createElement('span');
    tk.className = 'cc-tick';
    tk.style.left = p;
    ccTicks.appendChild(tk);

    const lb = document.createElement('button');
    lb.type = 'button';
    lb.className = 'cc-label';
    lb.style.left = p;
    lb.title = t.label;
    lb.setAttribute('aria-label', t.label);
    lb.textContent = t.emoji;
    lb.addEventListener('click', () => setTone(i));
    ccLabels.appendChild(lb);
  });
}

function setTone(i){
  i = Math.max(0, Math.min(TONE_MAX, i));
  toneIndex = i;
  selectedTone = TONES[i].key;
  const t = TONES[i];
  const p = tonePct(i) + '%';
  ccThumb.style.left = p;
  ccThumb.textContent = t.emoji;
  ccVeil.style.left = p;
  toneEmoji.textContent = t.emoji;
  toneName.textContent = t.label;
  toneDesc.textContent = t.desc;
  toneModel.textContent = '当前调用模型：' + (MODEL_LABELS[t.model] || t.model);
  [...ccTicks.children].forEach((c, idx) => c.classList.toggle('active', idx <= i));
  [...ccLabels.children].forEach((c, idx) => c.classList.toggle('active', idx === i));
  ccSlider.setAttribute('aria-valuenow', i);
  ccSlider.setAttribute('aria-valuetext', t.label);
}

function indexFromX(clientX){
  const r = ccInner.getBoundingClientRect();
  let ratio = r.width ? (clientX - r.left) / r.width : 0;
  ratio = Math.max(0, Math.min(1, ratio));
  return Math.round(ratio * TONE_MAX);
}

let sliderDragging = false;
ccSlider.addEventListener('pointerdown', (e) => {
  sliderDragging = true;
  ccSlider.classList.add('dragging');
  try{ ccSlider.setPointerCapture(e.pointerId); }catch{}
  setTone(indexFromX(e.clientX));
  ccSlider.focus();
  e.preventDefault();
});
ccSlider.addEventListener('pointermove', (e) => {
  if(!sliderDragging) return;
  setTone(indexFromX(e.clientX));
});
function endSliderDrag(){ sliderDragging = false; ccSlider.classList.remove('dragging'); }
ccSlider.addEventListener('pointerup', endSliderDrag);
ccSlider.addEventListener('pointercancel', endSliderDrag);
ccSlider.addEventListener('keydown', (e) => {
  if(e.key === 'ArrowLeft' || e.key === 'ArrowDown'){ setTone(toneIndex - 1); e.preventDefault(); }
  else if(e.key === 'ArrowRight' || e.key === 'ArrowUp'){ setTone(toneIndex + 1); e.preventDefault(); }
  else if(e.key === 'Home'){ setTone(0); e.preventDefault(); }
  else if(e.key === 'End'){ setTone(TONE_MAX); e.preventDefault(); }
});

buildSlider();
setTone(toneIndex);

/* ---------- 深浅色主题：自动跟随时间，不再提供手动切换按钮 ---------- */
/* 规则：早上 6 点（06:00）自动进入白天模式；晚上 6 点（18:00）自动进入黑夜模式 */
function autoTheme(){
  const h = new Date().getHours();
  return (h >= 6 && h < 18) ? 'light' : 'dark';
}
function applyTheme(t){
  document.documentElement.classList.toggle('night', t === 'dark');
  const meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute('content', (t === 'dark') ? '#13151e' : '#f7f9fa');
}
function syncTheme(){ applyTheme(autoTheme()); }
syncTheme();
// 页面若长时间停留在前台，每分钟检查一次，确保跨过 6:00 / 18:00 时能自动切换
setInterval(syncTheme, 60 * 1000);

function createIcon(name, className = 'ui-icon'){
  const svg = document.createElementNS(SVG_NS, 'svg');
  svg.setAttribute('viewBox', '0 0 24 24');
  svg.setAttribute('aria-hidden', 'true');
  className.split(/\s+/).filter(Boolean).forEach(namePart => svg.classList.add(namePart));
  (ICON_SHAPES[name] || ICON_SHAPES['check-circle']).forEach(([tag, attributes]) => {
    const element = document.createElementNS(SVG_NS, tag);
    Object.entries(attributes).forEach(([key, value]) => element.setAttribute(key, value));
    svg.appendChild(element);
  });
  return svg;
}

/* ---------- 工具 ---------- */
let toastTimer = null;
function toast(msg){
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
}

const pageShell = document.querySelector('.wrap');
function openModal(modalId, initialFocusId){
  const modal = $(modalId);
  modal.classList.add('show');
  pageShell?.setAttribute('inert', '');
  requestAnimationFrame(() => $(initialFocusId)?.focus());
}
function closeModal(modalId, restoreFocus){
  $(modalId).classList.remove('show');
  if(!document.querySelector('.modal-mask.show')) pageShell?.removeAttribute('inert');
  if(restoreFocus) requestAnimationFrame(() => restoreFocus.focus());
}
function showLogin(){ openModal('loginModal', 'loginGo'); }
function hideLogin(){ closeModal('loginModal'); }

/* 图片压缩为 dataURL（控制体积、提升 Vision 效果）*/
function fileToDataURL(file){
  return new Promise((resolve, reject) => {
    if(!file.type || !file.type.startsWith('image/')){ reject(new Error('仅支持图片')); return; }
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const MAX = 1280;
        let { width, height } = img;
        if(width > MAX || height > MAX){
          const s = Math.min(MAX / width, MAX / height);
          width = Math.round(width * s);
          height = Math.round(height * s);
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        // 先铺白底，避免透明表情包/贴纸转 JPEG 后透明处变黑、影响识别
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, width, height);
        ctx.drawImage(img, 0, 0, width, height);
        try{ resolve(canvas.toDataURL('image/jpeg', 0.85)); }
        catch{ resolve(reader.result); }
      };
      img.onerror = () => reject(new Error('图片读取失败'));
      img.src = reader.result;
    };
    reader.onerror = () => reject(new Error('图片读取失败'));
    reader.readAsDataURL(file);
  });
}

async function handleFile(file){
  if(!file) return;
  if(file.size > 15 * 1024 * 1024){ toast('图片太大了（上限 15MB）'); return; }
  try{
    currentImage = await fileToDataURL(file);
    previewImg.src = currentImage;
    preview.classList.add('show');
  }catch(e){ toast(e.message || '图片处理失败'); }
}

/* ---------- 上传交互 ---------- */
dropzone.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', () => { handleFile(fileInput.files[0]); fileInput.value = ''; });
removeImg.addEventListener('click', () => {
  currentImage = null; previewImg.src = ''; preview.classList.remove('show');
});
['dragenter','dragover'].forEach(ev =>
  dropzone.addEventListener(ev, (e) => { e.preventDefault(); dropzone.classList.add('dragover'); })
);
['dragleave','drop'].forEach(ev =>
  dropzone.addEventListener(ev, (e) => { e.preventDefault(); dropzone.classList.remove('dragover'); })
);
dropzone.addEventListener('drop', (e) => {
  const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
  if(f) handleFile(f);
});
/* 支持直接粘贴截图 */
window.addEventListener('paste', (e) => {
  const items = e.clipboardData && e.clipboardData.items;
  if(!items) return;
  for(const it of items){
    if(it.type && it.type.startsWith('image/')){ handleFile(it.getAsFile()); break; }
  }
});

/* ---------- 渲染结果（全部用 textContent，杜绝 XSS）---------- */
function buildStars(level){
  const wrap = document.createElement('div');
  wrap.className = 'stars';
  for(let i = 0; i < 5; i++){
    const s = document.createElement('span');
    if(i >= level) s.className = 'off';
    s.textContent = i < level ? '★' : '☆';
    wrap.appendChild(s);
  }
  return wrap;
}

function cardShell(iconName, title){
  const card = document.createElement('div');
  card.className = 'result-card';
  const t = document.createElement('div');
  t.className = 'rc-title';
  const tx = document.createElement('span'); tx.textContent = title;
  t.appendChild(createIcon(iconName)); t.appendChild(tx);
  card.appendChild(t);
  return card;
}

function renderTurn(comment, image, result, turnNo){
  if(emptyHint) emptyHint.style.display = 'none';
  // 轮次号以后端返回的 turns 为准（截断后会从 1 重新计数）
  turnCount = (typeof turnNo === 'number' && turnNo > 0) ? turnNo : (turnCount + 1);

  const turn = document.createElement('div');
  turn.className = 'turn';

  // 头部：轮次 + 引用
  const head = document.createElement('div');
  head.className = 'turn-head';
  const no = document.createElement('span');
  no.className = 'turn-no';
  no.textContent = '第 ' + turnCount + ' 轮';
  const quote = document.createElement('div');
  quote.className = 'turn-quote';
  if(comment){
    const quoteText = document.createElement('span');
    quoteText.className = 'quote-text';
    quoteText.textContent = comment;
    quote.appendChild(quoteText);
    quote.setAttribute('data-site-i18n-ignore', '');
  }else{
    const quoteText = document.createElement('span');
    quoteText.className = 'quote-text';
    quoteText.textContent = '仅图片';
    quote.appendChild(createIcon('image'));
    quote.appendChild(quoteText);
    quote.classList.add('img-only');
  }
  head.appendChild(no); head.appendChild(quote);
  turn.appendChild(head);

  // 卡片1：评论分析
  const a = result.analysis || {};
  const c1 = cardShell('search', '评论分析');
  const attackRow = document.createElement('div');
  attackRow.className = 'attack-row';
  const al = document.createElement('span');
  al.className = 'attack-label'; al.textContent = '攻击等级';
  attackRow.appendChild(al);
  attackRow.appendChild(buildStars(a.attack_level || 0));
  c1.appendChild(attackRow);

  const types = Array.isArray(a.types) ? a.types : [];
  const typesWrap = document.createElement('div');
  typesWrap.className = 'types';
  if(types.length){
    types.forEach(tp => {
      const tag = document.createElement('span');
      tag.className = 'type-tag';
      const tt = document.createElement('span');
      tt.textContent = tp;
      tt.setAttribute('data-site-i18n-ignore', '');
      tag.appendChild(createIcon('check')); tag.appendChild(tt);
      typesWrap.appendChild(tag);
    });
  }else{
    const none = document.createElement('span');
    none.className = 'types-empty'; none.textContent = '未检测到明显攻击类型';
    typesWrap.appendChild(none);
  }
  c1.appendChild(typesWrap);

  if(a.detail){
    const d = document.createElement('div');
    d.className = 'analysis-text'; d.textContent = a.detail;
    d.setAttribute('data-site-i18n-ignore', '');
    c1.appendChild(d);
  }
  turn.appendChild(c1);

  // 卡片2：建议
  const ad = result.advice || {};
  const c2 = cardShell('compass', '建议');
  const badge = document.createElement('div');
  badge.className = 'advice-badge';
  const bt = document.createElement('span'); bt.textContent = ACTION_LABEL[ad.action] || '无需处理';
  badge.appendChild(createIcon(ACTION_ICON[ad.action] || 'check-circle'));
  badge.appendChild(bt);
  c2.appendChild(badge);
  if(ad.reason){
    const r = document.createElement('div');
    r.className = 'advice-text'; r.textContent = ad.reason;
    r.setAttribute('data-site-i18n-ignore', '');
    c2.appendChild(r);
  }
  turn.appendChild(c2);

  // 卡片3：推荐回复
  const rp = result.reply || {};
  const c3 = cardShell('pen', '推荐回复');
  if(rp.should_reply && rp.reply_text && rp.reply_text.trim()){
    const box = document.createElement('div');
    box.className = 'reply-box';
    box.textContent = rp.reply_text.trim();
    box.setAttribute('data-site-i18n-ignore', '');
    c3.appendChild(box);

    const actions = document.createElement('div');
    actions.className = 'reply-actions';
    const copyBtn = document.createElement('button');
    copyBtn.className = 'copy-btn';
    copyBtn.type = 'button';
    let copyIcon = createIcon('copy');
    const cTx = document.createElement('span'); cTx.textContent = '复制回复';
    copyBtn.appendChild(copyIcon); copyBtn.appendChild(cTx);
    copyBtn.addEventListener('click', async () => {
      const text = rp.reply_text.trim();
      try{
        if(navigator.clipboard && navigator.clipboard.writeText){
          await navigator.clipboard.writeText(text);
        }else{
          const ta = document.createElement('textarea');
          ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
          document.body.appendChild(ta); ta.select();
          document.execCommand('copy'); document.body.removeChild(ta);
        }
        copyBtn.classList.add('copied');
        const copiedIcon = createIcon('check');
        copyIcon.replaceWith(copiedIcon);
        copyIcon = copiedIcon;
        cTx.textContent = '已复制';
        setTimeout(() => {
          copyBtn.classList.remove('copied');
          const resetIcon = createIcon('copy');
          copyIcon.replaceWith(resetIcon);
          copyIcon = resetIcon;
          cTx.textContent = '复制回复';
        }, 1800);
      }catch{ toast('复制失败，请手动选择文本'); }
    });
    actions.appendChild(copyBtn);
    c3.appendChild(actions);
  }else{
    const nr = document.createElement('div');
    nr.className = 'no-reply';
    const tx = document.createElement('div'); tx.className = 'nr-text';
    const strong = document.createElement('strong'); strong.textContent = '建议不要回复。';
    tx.appendChild(strong);
    if(rp.empty_reason && rp.empty_reason.trim()){
      const reason = document.createElement('span');
      reason.textContent = '　' + rp.empty_reason.trim();
      reason.setAttribute('data-site-i18n-ignore', '');
      tx.appendChild(reason);
    }else{
      tx.appendChild(document.createTextNode('　继续回应没有意义，留给它一个安静的角落即可。'));
    }
    nr.appendChild(createIcon('ban')); nr.appendChild(tx);
    c3.appendChild(nr);
  }
  turn.appendChild(c3);

  results.appendChild(turn);
  const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  turn.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block:'start' });
}

/* ---------- 额度 / 上下文展示 ---------- */
function renderQuota(s){
  if(s.isPro){ quotaChip.textContent = 'Pro · 无限'; }
  else if(typeof s.remaining === 'number'){ quotaChip.textContent = '今日剩余 ' + s.remaining + ' 次'; }
}
function renderContext(s){
  const turns = s.turns || 0;
  if(s.hasContext && turns > 0){
    turnCount = turns;
    ctxBar.classList.add('show');
    ctxText.textContent = '已有上下文 · ' + turns + ' 轮对话，继续生成将延续之前的讨论';
  }else{
    turnCount = 0;
    ctxBar.classList.remove('show');
  }
}

async function loadStatus(){
  try{
    const { ok, data } = await callFn({ action:'status' });
    if(ok){
      renderQuota(data);
      renderContext(data);
      if(data.configured === false){
        quotaChip.textContent = '待配置';
      }
    }else if(quotaChip.textContent === '加载中…'){
      quotaChip.textContent = '额度获取失败';
    }
  }catch(e){
    // 未登录已在 callFn 内处理；其余（如网络异常）给个兜底，避免一直停在“加载中…”
    if(e && e.message !== 'not_logged_in' && e.message !== 'unauthorized'
       && quotaChip.textContent === '加载中…'){
      quotaChip.textContent = '额度获取失败';
    }
  }
}

/* ---------- 生成 ---------- */
function setBusy(b){
  busy = b;
  generateBtn.disabled = b;
  generateBtn.classList.toggle('loading', b);
  results.setAttribute('aria-busy', String(b));
  genLabel.textContent = b ? '分析中…' : '生成建议';
}

async function generate(){
  if(busy) return;
  const comment = commentEl.value.trim();
  if(!comment && !currentImage){ toast('请输入对方评论，或上传一张图片'); return; }

  setBusy(true);
  try{
    const { ok, status, data } = await callFn({
      action:'generate',
      comment,
      image: currentImage || undefined,
      tone: selectedTone
    });

    if(ok && data.result){
      renderTurn(comment, currentImage, data.result, data.turns);
      // 重置输入，保留语气；延续上下文
      commentEl.value = '';
      currentImage = null; previewImg.src = ''; preview.classList.remove('show');
      if(typeof data.remaining === 'number' && !data.isPro){
        quotaChip.textContent = '今日剩余 ' + data.remaining + ' 次';
      }else if(data.isPro){
        quotaChip.textContent = 'Pro · 无限';
      }
      const turns = data.turns || turnCount;
      ctxBar.classList.add('show');
      ctxText.textContent = '已有上下文 · ' + turns + ' 轮对话，继续生成将延续之前的讨论';
      // 上下文过长时后端会自动开启新一段，给用户一个温和提示
      if(data.truncated){
        toast('对话较长，已自动开启新一段上下文，更早的内容不再延续');
      }
      return;
    }

    if(status === 429){ toast(data.error || '今日免费额度已用完，请明天再来。'); quotaChip.textContent = '今日剩余 0 次'; return; }
    if(status === 503){ toast(data.error || 'AI 服务尚未配置，请稍后再试'); return; }
    if(status === 401){ showLogin(); return; }
    toast(data.error || '生成失败，请稍后再试');
  }catch(e){
    if(e.message !== 'not_logged_in' && e.message !== 'unauthorized'){
      toast('网络异常，请稍后再试');
    }
  }finally{
    setBusy(false);
  }
}
generateBtn.addEventListener('click', generate);
/* Ctrl/Cmd + Enter 快捷生成 */
commentEl.addEventListener('keydown', (e) => {
  if((e.metaKey || e.ctrlKey) && e.key === 'Enter'){ e.preventDefault(); generate(); }
});

/* ---------- 清空上下文 ---------- */
clearCtxBtn.addEventListener('click', () => {
  if(turnCount > 0){
    openModal('confirmModal', 'confirmCancel');
  }else{
    toast('当前还没有上下文可清空');
  }
});
$('confirmCancel').addEventListener('click', () => closeModal('confirmModal', clearCtxBtn));
$('confirmOk').addEventListener('click', async () => {
  closeModal('confirmModal', clearCtxBtn);
  let cleared = false;
  try{
    const { ok } = await callFn({ action:'clear' });
    cleared = !!ok;
  }catch{}
  if(!cleared){ toast('清空失败，请稍后再试'); return; }
  // 清空界面 + 轮次计数归零（下一次生成将从「第 1 轮」重新开始）
  turnCount = 0;
  results.innerHTML = '';
  results.appendChild(emptyHint);
  emptyHint.style.display = '';
  ctxBar.classList.remove('show');
  toast('已清空上下文，开始新的对话');
});
document.addEventListener('keydown', (e) => {
  if(e.key === 'Escape' && $('confirmModal').classList.contains('show')){
    e.preventDefault();
    closeModal('confirmModal', clearCtxBtn);
  }
});

/* ---------- 登录弹窗按钮 ---------- */
$('loginGo').addEventListener('click', () => {
  // 记录登录后应跳回本页：localStorage 兜底（可跨 OAuth 往返），URL 参数更直接
  try{ localStorage.setItem('loginReturnTo', 'copilot.html'); }catch{}
  location.href = 'login.html?return=copilot.html';
});
$('loginCancel').addEventListener('click', () => { location.href = 'index.html'; });

/* ---------- 启动 ---------- */
(async function init(){
  const token = localStorage.getItem('token');
  if(!token){ showLogin(); quotaChip.textContent = '未登录'; return; }
  await loadStatus();
})();
</script>
