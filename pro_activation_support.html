    body { min-height: 100vh; padding: var(--space-8) var(--space-4) var(--space-12); }

    p, li { color: var(--text-2); line-height: 1.7; }
    ul { padding-left: 1.25rem; display: grid; gap: var(--space-2); }
    .notice { margin-top: var(--space-5); padding: var(--space-4); border: 1px solid var(--border); border-radius: var(--r-md); background: var(--surface-2); }
    .notice strong { display: block; margin-bottom: var(--space-2); color: var(--text); }
    .actions { display: grid; gap: var(--space-3); margin-top: var(--space-5); }
    .button, .copy-button { min-height: 42px; display: inline-flex; align-items: center; justify-content: center; border-radius: var(--r-md); border: 1px solid var(--border-strong); padding: 0 var(--space-4); font: inherit; font-weight: 650; cursor: pointer; text-decoration: none; color: var(--text); background: var(--surface); }

    .email { font-weight: 700; letter-spacing: .02em; word-break: break-all; }
    .status { min-height: 1.4em; color: var(--text-3); text-align: center; font-size: var(--text-sm); }
    .back { display: inline-block; margin-top: var(--space-7); color: var(--text-2); }
    @media (max-width: 480px) { body { padding-top: var(--space-4); } .support-card { margin-top: var(--space-10); padding: var(--space-6) var(--space-4); } }

        const selected = window.SiteI18n?.getLanguage?.() || localStorage.getItem("lang") || "zh";
        return COPY[selected] ? selected : "zh";
      }
      function applyCopy() {
        const copy = COPY[getLanguage()];
        document.documentElement.lang = getLanguage() === "zh-Hant" ? "zh-Hant" : getLanguage();
        document.title = `${copy.title} - Sunland AI`;
        document.querySelectorAll("[data-copy]").forEach(element => { element.textContent = copy[element.dataset.copy] || ""; });
        const mail = document.getElementById("mailButton");
        mail.href = `mailto:${EMAIL}?subject=${encodeURIComponent(copy.subject)}&body=${encodeURIComponent(copy.template)}`;
        document.getElementById("copyEmail").onclick = () => copyText(EMAIL, copy.copiedEmail, copy.copyFailed);
        document.getElementById("copyTemplate").onclick = () => copyText(copy.template, copy.copiedTemplate, copy.copyFailed);
      }
      async function copyText(value, success, failure) {
        const status = document.getElementById("copyStatus");
        try {
          await navigator.clipboard.writeText(value);
          status.textContent = success;
        } catch {
          status.textContent = failure;
        }
      }
      applyCopy();
      window.addEventListener("DOMContentLoaded", applyCopy, { once: true });
      window.addEventListener("site-language-change", applyCopy);
